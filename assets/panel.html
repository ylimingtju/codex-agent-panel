<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Agent Panel</title>
<style>
  :root { color-scheme:light dark; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
    --ink:light-dark(#1b2028,#eff1f6); --muted:light-dark(#57616f,#acb6c6); --rule:light-dark(#dce0e6,#3a424f);
    --wash:light-dark(#f0f2f5,#282e38); --bg:light-dark(#fff,#1a1e25); --accent:light-dark(#087f78,#4ecdc0);
    --warn:light-dark(#a86a08,#f0ba60); --ok:light-dark(#28814b,#77cd94); --error:light-dark(#ac403d,#f19893); }
  :root[data-theme="dark"] { color-scheme:dark } :root[data-theme="light"] { color-scheme:light }
  * { box-sizing:border-box } body { margin:0; color:var(--ink); background:transparent; }
  [hidden] { display:none!important } button,input { color:inherit; font:inherit; }
  button { cursor:pointer } button:focus-visible,input:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  main { background:var(--bg); } h1,h2,p { margin:0 } h1 { font-size:17px; font-weight:650; overflow-wrap:anywhere }
  .lead { padding:12px 14px 14px; } .lead p { color:var(--muted); margin:3px 0 9px; }
  .bar { height:6px; background:var(--rule); border-radius:6px; overflow:hidden; }
  .bar i { display:block; background:var(--accent); height:100%; }
  #summary { padding:9px 12px 10px; background:var(--bg); border:1px solid var(--rule); border-radius:10px; }
  .counts { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; margin-bottom:7px; }
  .counts strong { min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .counts button { margin-left:auto; color:var(--ink); font-weight:600; }
  .toggle { background:transparent; border:none; padding:2px 0; }
  .hint,.message { color:var(--muted); font-size:12px; padding:7px 12px; overflow-wrap:anywhere; }
  .hint button { color:var(--accent); font-weight:600; }
  .message:empty { display:none }
  h2 { background:var(--wash); padding:5px 14px; font-size:12px; font-weight:650; color:var(--muted); }
  .count { margin-left:6px; font-weight:500; }
  .agent { border-bottom:1px solid var(--rule); }
  .agent:last-child { border-bottom:0; }
  .agent summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:48px minmax(0,1fr);
    align-items:center; gap:10px; padding:10px 14px; }
  .agent summary::-webkit-details-marker { display:none }
  .agent summary:hover { background:var(--wash) }
  .name { display:flex; align-items:baseline; gap:8px; }
  .name strong { overflow-wrap:anywhere; flex:1; font-size:14px; }
  .time { font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); white-space:nowrap; }
  .status,.steps { color:var(--muted); font-size:12px; margin-top:3px; overflow-wrap:anywhere; }
  .status::before { content:''; display:inline-block; width:7px; height:7px; border-radius:100%; background:var(--muted); margin-right:6px; vertical-align:1px; }
  [data-state="running"] .status::before { background:var(--accent); }
  [data-state="review"] .status::before,[data-state="waiting"] .status::before { background:var(--warn); }
  [data-state="accepted"] .status::before { content:'✓'; width:auto; height:auto; border-radius:0; background:none; color:var(--ok); font-weight:bold; }
  [data-state="failed"] .status::before,[data-state="interrupted"] .status::before { background:var(--error); }
  .stepbar { margin-top:5px; max-width:190px; height:4px; }
  .meta { margin:0 14px 10px 72px; color:var(--muted); font-size:12px; display:grid; grid-template-columns:max-content minmax(0,1fr); gap:3px 9px; }
  .meta dt,.meta dd { margin:0; overflow-wrap:anywhere; }
  .pet { width:48px; height:52px; background-image:url('__SAVVY_SPRITE__'); background-size:800% 1100%; image-rendering:pixelated; background-repeat:no-repeat; }
  .agent.planned summary { grid-template-columns:minmax(0,1fr); }
  .agent.planned .meta { margin-left:14px; }
  .pet.missing { background-image:none; height:20px; width:20px; border:2px solid var(--rule); border-radius:5px; justify-self:center; }
  .empty { color:var(--muted); padding:12px 14px; }
  form { padding:12px; max-width:520px; } label { display:block; font-weight:600; }
  .pair-controls { display:flex; gap:8px; margin-top:7px; }
  .pair-controls input { min-width:0; width:100%; background:var(--bg); padding:6px; border:1px solid var(--rule); border-radius:6px; }
  .pair-controls button { white-space:nowrap; border:1px solid var(--rule); border-radius:6px; background:var(--wash); padding:4px 10px; }
  .pair-explain { color:var(--muted); margin-top:6px; font-size:12px; }
  @media(max-width:290px){ .lead,.agent summary,h2{padding-left:8px;padding-right:8px} .agent summary{gap:6px} .name{flex-wrap:wrap;gap:2px 6px} .meta{margin-left:9px;} .counts{gap:3px 6px;} }
</style>
</head>
<body>
<main>
  <form id="pair" hidden>
    <label for="key">连接当前聊天的进度</label>
    <div class="pair-controls"><input id="key" type="password" placeholder="只读配对码" required autocomplete="off" spellcheck="false"><button>连接</button></div>
    <p class="pair-explain">输入本聊天进度卡中的配对码。</p>
  </form>
  <section id="summary" hidden aria-label="子代理总进度">
    <div class="counts"><strong id="trackTitle"></strong><span id="trackPhase"></span><span id="count"></span><span id="busy"></span><button class="toggle" id="detailsButton" title="在聊天右侧打开子代理面板">在右侧打开 ›</button></div>
    <div class="bar" aria-hidden="true"><i></i></div>
  </section>
  <div id="panelHint" class="hint" hidden>当前窗口未能打开侧栏。请在 Codex 桌面端的这段聊天里输入「查看子代理详情」。<button class="toggle" id="pairCodeButton">显示配对码</button> <code id="pairCode" hidden></code></div>
  <article id="details" hidden aria-label="子代理">
    <header class="lead"><h1></h1><p><span id="detailCount"></span> · <span id="elapsed"></span></p><div class="bar" aria-hidden="true"><i></i></div></header>
    <div id="groups"></div>
  </article>
  <p id="message" class="message" role="status">正在连接进度面板…</p>
</main>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const view = '__SAVVY_VIEW__';
const isTrack = view === 'track';
const embedded = window.parent !== window;
let data, viewKey = '', requestId = 0, ready, refreshTimer, inFlight = false, lastSignature, visibleSince = performance.now();
const pending = new Map(), rows = new Map(), transitions = new Map();
let states = new Map();
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let onScreen = true, displayMode = 'inline', supportedModes, opening = false, showHint = false;
let lastOpenRequest;
const visible = () => onScreen && !document.hidden;
const groupTitles = ['进行中', '待复核', '已结束', '未开始'];
const stateText = {running:'运行中', waiting:'等待中', planned:'计划中', review:'待主代理验收', accepted:'已验收', interrupted:'已中断', failed:'失败', cancelled:'已取消', stopped:'已停止 · 结果未报告', ended:'已返回 · 未验收'};
const phaseText = {plan:'规划', design:'设计', delegate:'执行', review:'复核', close:'收尾'};
const animations = {idle:[0,1,1,1], working:[7,6,120,220], review:[8,6,150,280], wait:[6,6,150,260], failed:[5,8,140,240], wave:[3,4,140,280]};
const oneShot = {review:'review',waiting:'wait',accepted:'wave',failed:'failed'};
const headerBar = $('#summary .bar i'), detailBar = $('#details .bar i');
let pulseTimer;
function msg(text) { $('#message').textContent = text; }
function el(tag, cls, value) {
  const n = document.createElement(tag);

  if (value !== undefined) n.textContent = value;

}
function post(obj) { if (embedded) parent.postMessage({jsonrpc:'2.0', ...obj}, '*'); }
function rpc(method, params) {

function context(c) {

async function call(name, key) {

}
function receive(d) {

function displayTime(start,end,running) {

function setBar(node,n,total) { node.style.width = (total > 0 ? Math.max(0,Math.min(100,n*100/total)) : 0)+'%'; }
function render(live = false) {
  if (!data) return;

  const count = d.total_known !== false && (d.total > 0 || d.total_known === true) ? '已验收 '+d.accepted+'/'+d.total : '尚未声明任务';
  $('#count').textContent = count; $('#busy').textContent = '运行中 '+running;
  const panel = displayMode === 'fullscreen';
  $('#summary').hidden = panel;
  $('#details').hidden = !panel;

  $('#detailsButton').disabled=opening;
  $('#details h1').textContent = d.title || '子代理';
  const phase = phaseText[d.phase] || d.phase;
  const flowState = d.status === 'interrupted' ? '已中断' : d.status === 'completed' ? '已结束' : phase;

  $('#trackPhase').textContent = phase || '阶段未报告';
  $('#detailCount').textContent = [count,flowState].filter(Boolean).join(' · ');

  const tasks = new Map(d.tasks.map(t => [t.id,t])), attached = new Set(), lastByTask = new Map();

    const task = tasks.get(a.task_id);

    let state = a.status in stateText ? a.status : 'stopped';
    if (a.status === 'ended' && (!task || lastByTask.get(task.id) === a.id)) state = task?.accepted ? 'accepted' : 'review';

  for (const t of d.tasks) if (!attached.has(t.id)) {
    const state = t.accepted ? 'accepted' : d.status === 'interrupted' ? 'interrupted' : 'planned';

  const rank = entry => planOrder.get(entry.task?.id) ?? Infinity;

  const nextStates = new Map();

  rows.clear();
  const fragment = document.createDocumentFragment();
  groups.forEach((entries,i) => {
    if (!entries.length) return;
    const h = el('h2','',groupTitles[i]); h.append(el('span','count',String(entries.length))); fragment.append(h);
    for (const entry of entries.sort((left,right)=>rank(left)-rank(right))) {
      nextStates.set(entry.id,entry.state);
      if (states.get(entry.id) !== entry.state) {
        transitions.delete(entry.id);
        if (live && visible() && !reduced.matches && oneShot[entry.state])

}
function makeRow(entry,open) {

  const node = el('details',a ? 'agent' : 'agent planned'); node.dataset.state = state; node.dataset.entryId=id; node.open = open;

  copy.append(name,el('div','status',stateText[state]));
  if (a && (a.note || Number.isFinite(a.done) && Number.isFinite(a.total))) {
    const progress = Number.isFinite(a.done) && a.total > 0;

    const {state,a} = entry;

async function refresh() {

$('#detailsButton').onclick=openPanel;
$('#pairCodeButton').onclick=()=>{

$('#pair').onsubmit=async e=>{

function visibilityChanged() {

document.addEventListener('visibilitychange',visibilityChanged);
new IntersectionObserver(([entry])=>{

}).observe(document.querySelector('main'));
reduced.addEventListener('change',()=>{transitions.clear(); pulse();});

});
const probe=el('span','pet');
document.body.append(probe);
const hasSprite=getComputedStyle(probe).backgroundImage.startsWith('url("data:image/');
probe.remove();
if (embedded) {
  ready=rpc('ui/initialize',{protocolVersion:'2026-01-26',appCapabilities:{availableDisplayModes:isTrack ? ['inline','fullscreen'] : ['fullscreen']},appInfo:{name:'savvy-progress',version:'__SAVVY_VERSION__'}})
    .then(r=>{ context(r?.hostContext); post({method:'ui/notifications/initialized',params:{}}); })
    .catch(()=>{msg('宿主未连接。请从当前聊天重新打开子代理面板。');});

    if (viewKey) return;
    if (isTrack && displayMode!=='fullscreen') { $('#pair').hidden=false; msg(''); return; }
    try { receive(await call('snapshot')); }
    catch { if(!viewKey){$('#pair').hidden=false;msg('');} }
  });
  let height=-1;
  new ResizeObserver(()=>{const h=Math.ceil(document.querySelector('main').getBoundingClientRect().height);
    if(h!==height && h>0){height=h;post({method:'ui/notifications/size-changed',params:{height:h}});}
  }).observe(document.querySelector('main'));
} else msg('请在 Codex 当前聊天中打开子代理面板。');
</script>
</body>
</html>
